<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1080" width="100%" height="100%" style="background:#FFFFFF; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="900" height="1035" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="480" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="39" font-size="12" font-weight="bold" fill="#000000">act: AI Stylist Chat &amp; Dynamic Context Injection</text>

  <!-- Swimlane 1: User / Frontend -->
  <rect x="35" y="60" width="270" height="980" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <line x1="35" y1="92" x2="305" y2="92" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">User / Studio Chat UI</text>

  <!-- Swimlane 2: Backend Chat API -->
  <rect x="305" y="60" width="345" height="980" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <line x1="305" y1="92" x2="650" y2="92" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Backend Chat API (app/api/chat.py)</text>

  <!-- Swimlane 3: SQLite DB & AI Provider -->
  <rect x="650" y="60" width="255" height="980" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <line x1="650" y1="92" x2="905" y2="92" stroke="#000000" stroke-width="1.5"/>
  <text x="777" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">SQLite DB &amp; AI Provider</text>

  <!-- Start -->
  <circle cx="170" cy="122" r="11" fill="#000000"/>
  <line x1="170" y1="133" x2="170" y2="160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Input text / prompt chip -->
  <rect x="65" y="160" width="210" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Enter Query or Click Chip</text>
  <text x="170" y="195" text-anchor="middle" font-size="10" fill="#000000">(Free query / Prompt chips)</text>

  <line x1="170" y1="206" x2="170" y2="235" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Send POST /api/v1/chat with canvas context -->
  <rect x="65" y="235" width="210" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">POST /api/v1/chat</text>
  <text x="170" y="268" text-anchor="middle" font-size="10" fill="#000000">Attach active chat messages +</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#000000">canvas_garment_ids context</text>

  <!-- Flow to Backend -->
  <path d="M 275 261 L 477 261 L 477 305" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Load Catalog & Rules -->
  <rect x="360" y="305" width="235" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Load Catalog &amp; Cultural Rules</text>
  <text x="477" y="339" text-anchor="middle" font-size="10" fill="#000000">Query 17 garments &amp; rules from DB</text>

  <!-- Flow to DB -->
  <path d="M 595 328 L 685 328" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: DB Select -->
  <rect x="685" y="308" width="190" height="40" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">SQLAlchemy SELECT</text>
  <text x="780" y="339" text-anchor="middle" font-size="9" fill="#000000">Garment, CulturalRule tables</text>

  <!-- Flow back to Backend -->
  <path d="M 780 348 L 780 380 L 477 380 L 477 400" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Dynamic Context Injection & Sliding Window -->
  <rect x="345" y="400" width="265" height="64" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="419" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Dynamic Context Injection</text>
  <text x="477" y="434" text-anchor="middle" font-size="10" fill="#000000">1. Resolve Canvas Outfit from IDs</text>
  <text x="477" y="447" text-anchor="middle" font-size="10" fill="#000000">2. Apply Sliding Window (Last 6 turns)</text>
  <text x="477" y="459" text-anchor="middle" font-size="10" fill="#000000">3. Merge Catalog, Rules &amp; Policies</text>

  <line x1="477" y1="464" x2="477" y2="495" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Dispatch to AI Provider -->
  <rect x="355" y="495" width="245" height="44" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Call AIService.generate_chat_json()</text>
  <text x="477" y="528" text-anchor="middle" font-size="10" fill="#000000">(max_tokens=800, response_format)</text>

  <!-- Flow to Provider -->
  <path d="M 600 517 L 685 517" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: Multi-Provider LLM Call -->
  <rect x="685" y="495" width="190" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="513" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Execute LLM Completion</text>
  <text x="780" y="527" text-anchor="middle" font-size="9" fill="#000000">Groq / OpenRouter / OpenAI</text>
  <text x="780" y="537" text-anchor="middle" font-size="9" fill="#000000">(Qwen 27B / GPT-OSS 120B / Nemotron)</text>

  <!-- Flow back -->
  <path d="M 780 541 L 780 575 L 477 575 L 477 595" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Rate Limit (429)? -->
  <polygon points="477,595 560,620 477,645 394,620" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="624" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">429 Rate Limit?</text>

  <!-- Yes 429: Auto retry / Fallback -->
  <path d="M 560 620 L 685 620" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="612" font-size="10" fill="#000000">[Yes]</text>
  <rect x="685" y="602" width="190" height="38" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="618" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Auto-sleep 2.5s &amp; Retry</text>
  <text x="780" y="632" text-anchor="middle" font-size="9" fill="#000000">Model Fallback if quota exhausted</text>

  <path d="M 780 640 L 780 670 L 477 670 L 477 685" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- No 429 merge -->
  <line x1="477" y1="645" x2="477" y2="685" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="660" font-size="10" fill="#000000">[No]</text>

  <!-- Decision: Valid JSON returned? -->
  <polygon points="477,685 560,710 477,735 394,710" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="714" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Valid JSON?</text>

  <!-- No JSON: Fallback -->
  <path d="M 394 710 L 330 710 L 330 765 L 360 765" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="702" font-size="10" fill="#000000">[No]</text>
  <rect x="360" y="748" width="180" height="34" rx="8" ry="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="769" text-anchor="middle" font-size="10" fill="#000000">Return Safe Fallback Reply</text>

  <!-- Yes JSON: Parse Schema -->
  <line x1="477" y1="735" x2="477" y2="805" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="750" font-size="10" fill="#000000">[Yes]</text>

  <rect x="350" y="805" width="255" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="477" y="824" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Parse ChatResponse Schema</text>
  <text x="477" y="839" text-anchor="middle" font-size="10" fill="#000000">• reply, suggestions (with IDs)</text>
  <text x="477" y="851" text-anchor="middle" font-size="10" fill="#000000">• etiquette_score (0-100), tips</text>

  <!-- Merge fallback to return -->
  <path d="M 450 782 L 450 805" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Return Flow to Client -->
  <path d="M 350 831 L 170 831 L 170 885" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 8: Render in Studio Chat -->
  <rect x="65" y="885" width="210" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="904" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Render Message in Chat</text>
  <text x="170" y="919" text-anchor="middle" font-size="10" fill="#000000">• Text reply + Etiquette Badge</text>
  <text x="170" y="931" text-anchor="middle" font-size="10" fill="#000000">• 1-Click "Ghép vào Canvas" button</text>

  <line x1="170" y1="939" x2="170" y2="975" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End Node -->
  <circle cx="170" cy="990" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="170" cy="990" r="7" fill="#000000"/>

</svg>