<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 940" width="100%" height="100%" style="background:#FFFFFF; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="660" height="895" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="400" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="39" font-size="12" font-weight="bold" fill="#000000">act: Catalog Exploration &amp; Garment Lore Pipeline</text>

  <!-- Initial Node -->
  <circle cx="350" cy="72" r="11" fill="#000000"/>
  <line x1="350" y1="83" x2="350" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Open /catalog -->
  <rect x="200" y="110" width="300" height="42" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Open Heritage Catalog (/catalog)</text>
  <text x="350" y="143" text-anchor="middle" font-size="10" fill="#000000">Browse exhibition gallery of 17 garments</text>

  <line x1="350" y1="152" x2="350" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Apply Filters -->
  <rect x="195" y="180" width="310" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Select Category Filter or Search Query</text>
  <text x="350" y="214" text-anchor="middle" font-size="10" fill="#000000">• Categories: Áo, Quần, Nón, Giày, Phụ kiện, Tân thời</text>
  <text x="350" y="226" text-anchor="middle" font-size="10" fill="#000000">• Style: Tất cả / Cổ truyền / Remix Gen Z</text>

  <line x1="350" y1="232" x2="350" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: GET API -->
  <rect x="200" y="260" width="300" height="42" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Send GET /api/v1/garments</text>
  <text x="350" y="293" text-anchor="middle" font-size="10" fill="#000000">Params: category, is_traditional, search, limit</text>

  <line x1="350" y1="302" x2="350" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: SQLAlchemy Query -->
  <rect x="195" y="330" width="310" height="64" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">GarmentService.get_list() [SQLAlchemy]</text>
  <text x="350" y="366" text-anchor="middle" font-size="10" fill="#000000">1. Apply WHERE filters (category, is_traditional)</text>
  <text x="350" y="380" text-anchor="middle" font-size="10" fill="#000000">2. Load rental pricing, deposits, and sizes</text>

  <line x1="350" y1="394" x2="350" y2="425" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Serialization & Image Enrichment -->
  <rect x="200" y="425" width="300" height="44" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Pydantic Serialization &amp; Asset URLs</text>
  <text x="350" y="459" text-anchor="middle" font-size="10" fill="#000000">Map models to GarmentResponse &amp; resolve images</text>

  <line x1="350" y1="469" x2="350" y2="500" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Render Gallery Grid -->
  <rect x="195" y="500" width="310" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="519" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Render Exhibition Grid (GarmentCard)</text>
  <text x="350" y="534" text-anchor="middle" font-size="10" fill="#000000">• Woodblock artwork &amp; Heritage/Remix badge</text>
  <text x="350" y="546" text-anchor="middle" font-size="10" fill="#000000">• Name, era, price/day (150k/80k), available sizes</text>

  <line x1="350" y1="554" x2="350" y2="585" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: Click for Lore Detail -->
  <rect x="200" y="585" width="300" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="604" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Open Lore &amp; Rental Modal</text>
  <text x="350" y="619" text-anchor="middle" font-size="10" fill="#000000">View historical description, styling tips, rental terms</text>

  <line x1="350" y1="631" x2="350" y2="665" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 8: Action -->
  <rect x="200" y="665" width="300" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="684" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Direct Actions from Modal</text>
  <text x="350" y="699" text-anchor="middle" font-size="10" fill="#000000">• "Thử phối đồ ngay" (Redirects to /studio)</text>
  <text x="350" y="711" text-anchor="middle" font-size="10" fill="#000000">• "Thêm vào giỏ thuê" (Rental Cart)</text>

  <line x1="350" y1="717" x2="350" y2="755" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final Node -->
  <circle cx="350" cy="770" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="350" cy="770" r="7" fill="#000000"/>

</svg>