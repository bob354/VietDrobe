<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1020" width="100%" height="100%" style="background:#FFFFFF; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="700" height="975" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="410" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="39" font-size="12" font-weight="bold" fill="#000000">act: Two-Tier Cultural Integrity Guardrail Pipeline</text>

  <!-- Start -->
  <circle cx="360" cy="72" r="11" fill="#000000"/>
  <line x1="360" y1="83" x2="360" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Input -->
  <rect x="210" y="110" width="300" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Receive Garment IDs / Combination</text>
  <text x="360" y="144" text-anchor="middle" font-size="10" fill="#000000">Initialize score = 1.0, violations = []</text>

  <line x1="360" y1="156" x2="360" y2="185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 1 Label -->
  <rect x="20" y="185" width="220" height="22" fill="#FAF7F2" stroke="#000000" stroke-width="1"/>
  <text x="28" y="200" font-size="10" font-weight="bold" fill="#000000">Tier 1: Deterministic Rule Engine</text>

  <!-- Rule 1 Traditional Anchor -->
  <polygon points="360,185 475,215 360,245 245,215" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Rule 1: Has Traditional Item?</text>
  <text x="360" y="225" text-anchor="middle" font-size="9" fill="#000000">any(g.is_traditional)</text>

  <!-- Rule 1 False -->
  <path d="M 475 215 L 575 215 L 575 255" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="207" font-size="10" fill="#000000">[No]</text>
  <rect x="485" y="255" width="180" height="42" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="575" y="273" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Warning: Missing Heritage</text>
  <text x="575" y="287" text-anchor="middle" font-size="9" fill="#000000">score -= 0.2</text>

  <!-- Merge Rule 1 -->
  <line x1="360" y1="245" x2="360" y2="335" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="270" font-size="10" fill="#000000">[Yes]</text>
  <path d="M 575 297 L 575 320 L 360 320" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Rule 2 Sacred tops require bottoms -->
  <polygon points="360,335 480,367 360,399 240,367" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="364" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Rule 2: Sacred Top Has Bottom?</text>
  <text x="360" y="377" text-anchor="middle" font-size="9" fill="#000000">(Áo Dài / Tấc / Ngũ Thân requires pants/skirt)</text>

  <!-- Rule 2 Violation -->
  <path d="M 480 367 L 575 367 L 575 410" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="359" font-size="10" fill="#000000">[No Bottom]</text>
  <rect x="485" y="410" width="180" height="44" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="575" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Fatal Error: Modesty Breach</text>
  <text x="575" y="443" text-anchor="middle" font-size="9" fill="#000000">score -= 0.5 (mark invalid)</text>

  <!-- Merge Rule 2 -->
  <line x1="360" y1="399" x2="360" y2="490" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="425" font-size="10" fill="#000000">[Valid]</text>
  <path d="M 575 454 L 575 475 L 360 475" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Rule 3 Dynamic DB Rules Loop -->
  <rect x="210" y="490" width="300" height="64" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Rule 3: Evaluate Dynamic DB Rules</text>
  <text x="360" y="526" text-anchor="middle" font-size="10" fill="#000000">• Check gender compatibility (gender_fit)</text>
  <text x="360" y="540" text-anchor="middle" font-size="10" fill="#000000">• Check incompatible &amp; required_with pairs</text>

  <line x1="360" y1="554" x2="360" y2="585" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 2 Label -->
  <rect x="20" y="585" width="220" height="22" fill="#FAF7F2" stroke="#000000" stroke-width="1"/>
  <text x="28" y="600" font-size="10" font-weight="bold" fill="#000000">Tier 2: Real-Time AI Etiquette Check</text>

  <!-- Decision: AI Chat Critique Active? -->
  <polygon points="360,585 475,617 360,649 245,617" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="613" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Context Consultation / AI Chat?</text>

  <!-- AI Path -->
  <path d="M 475 617 L 575 617 L 575 660" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="609" font-size="10" fill="#000000">[In Chat]</text>

  <rect x="475" y="660" width="200" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="575" y="679" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">LLM Cultural Etiquette Analysis</text>
  <text x="575" y="693" text-anchor="middle" font-size="9" fill="#000000">• Evaluate temple/festival etiquette</text>
  <text x="575" y="704" text-anchor="middle" font-size="9" fill="#000000">• Etiquette score (0-100) &amp; styling tips</text>

  <!-- Merge to Finalization -->
  <line x1="360" y1="649" x2="360" y2="745" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="675" font-size="10" fill="#000000">[Canvas Only]</text>
  <path d="M 575 712 L 575 730 L 360 730" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Step 3: Score Normalization -->
  <rect x="210" y="745" width="300" height="48" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="765" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Normalize Score &amp; Compute Validity</text>
  <text x="360" y="781" text-anchor="middle" font-size="10" fill="#000000">score = clamp(0.0, 1.0); is_valid = (no fatal errors)</text>

  <line x1="360" y1="793" x2="360" y2="825" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Return Payload -->
  <rect x="200" y="825" width="320" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="844" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Return CulturalCheckResponse</text>
  <text x="360" y="859" text-anchor="middle" font-size="10" fill="#000000">• is_valid: true / false</text>
  <text x="360" y="871" text-anchor="middle" font-size="10" fill="#000000">• score: 0.0 - 1.0 (Canvas) / 0 - 100 (Chat Etiquette)</text>

  <line x1="360" y1="879" x2="360" y2="915" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final Node -->
  <circle cx="360" cy="930" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="360" cy="930" r="7" fill="#000000"/>

</svg>