<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 880" width="100%" height="100%" style="background:#FFFFFF; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="660" height="835" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="430" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="39" font-size="12" font-weight="bold" fill="#000000">act: System Bootstrapping &amp; Multi-Provider Readiness</text>

  <!-- Initial Node -->
  <circle cx="350" cy="72" r="11" fill="#000000"/>
  <line x1="350" y1="83" x2="350" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Lifespan Startup -->
  <rect x="200" y="110" width="300" height="42" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">FastAPI Lifespan Startup (app/main.py)</text>
  <text x="350" y="143" text-anchor="middle" font-size="10" fill="#000000">Initialize engine &amp; configure lifecycle events</text>

  <line x1="350" y1="152" x2="350" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: PRAGMA foreign_keys -->
  <rect x="200" y="180" width="300" height="42" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Enforce SQLite Foreign Key Constraints</text>
  <text x="350" y="213" text-anchor="middle" font-size="10" fill="#000000">PRAGMA foreign_keys = ON</text>

  <line x1="350" y1="222" x2="350" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Base.metadata.create_all -->
  <rect x="200" y="250" width="300" height="44" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Create Database Tables (create_all)</text>
  <text x="350" y="283" text-anchor="middle" font-size="10" fill="#000000">Garments, Outfits, CulturalRules, Rentals</text>

  <line x1="350" y1="294" x2="350" y2="322" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1: Seed Needed? -->
  <polygon points="350,322 455,350 350,378 245,350" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="354" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Database Has Data?</text>

  <!-- Branch No: Seed Data -->
  <line x1="350" y1="378" x2="350" y2="412" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="396" font-size="10" fill="#000000">[No]</text>

  <rect x="200" y="412" width="300" height="48" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="431" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Seed Initial JSON Data</text>
  <text x="350" y="446" text-anchor="middle" font-size="10" fill="#000000">Load garments.json (17 items) &amp; cultural_rules.json</text>

  <!-- Branch Yes: Skip Seed -->
  <path d="M 455 350 L 545 350 L 545 480 L 350 480" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="465" y="342" font-size="10" fill="#000000">[Yes: Skip]</text>

  <line x1="350" y1="460" x2="350" y2="505" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Pillow Graphic Generation -->
  <rect x="200" y="505" width="300" height="48" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Pillow Graphic Generator (seed.py)</text>
  <text x="350" y="539" text-anchor="middle" font-size="10" fill="#000000">Verify ./data/garments/*.png and generate if missing</text>

  <line x1="350" y1="553" x2="350" y2="585" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: AI Provider Configuration -->
  <rect x="200" y="585" width="300" height="52" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="604" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Configure AI Provider (app/config.py)</text>
  <text x="350" y="619" text-anchor="middle" font-size="10" fill="#000000">• Provider: groq | openrouter | openai</text>
  <text x="350" y="630" text-anchor="middle" font-size="10" fill="#000000">• Set base_url, API keys &amp; max_tokens=800</text>

  <line x1="350" y1="637" x2="350" y2="670" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: System Ready -->
  <rect x="200" y="670" width="300" height="46" rx="10" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="689" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">System Ready for Traffic</text>
  <text x="350" y="704" text-anchor="middle" font-size="10" fill="#000000">FastAPI on :8000 &amp; Next.js Proxy on :3000</text>

  <line x1="350" y1="716" x2="350" y2="750" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final Node -->
  <circle cx="350" cy="765" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <circle cx="350" cy="765" r="7" fill="#000000"/>

</svg>